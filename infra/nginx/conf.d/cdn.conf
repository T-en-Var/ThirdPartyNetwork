server {
    listen 443 ssl;
    http2 on;
    server_name cdn.tpn.test;

    ssl_certificate     /etc/nginx/certs/tpn.test.pem;
    ssl_certificate_key /etc/nginx/certs/tpn.test-key.pem;

    # MinIO's S3 API (file/object storage), not its web console (9001).
    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;

        # MinIO signs/validates presigned URLs against this Host header, so it
        # must stay exactly what the backend signed the URL for (cdn.tpn.test).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
