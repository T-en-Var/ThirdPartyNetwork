name: Build and Deploy ASP.NET 9 Backend

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Publish backend
        run: dotnet publish -c Release -o publish

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "publish/*"
          target: "/var/www/thirdpartynetwork"

      - name: Run migrations on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # navigate to deployed folder
            cd /var/www/thirdpartynetwork/publish
            
            # export environment variables from .env
            export $(grep -v '^#' .env | xargs)
            
            # install dotnet-ef globally if missing
            dotnet tool install --global dotnet-ef || true
            
            # add global tools to PATH for this session
            export PATH="$HOME/.dotnet/tools:$PATH"
            
            # run EF migrations
            dotnet ef database update --project thirdpartynetwork.dll


      - name: Restart backend service
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            sudo systemctl daemon-reload
            sudo systemctl restart thirdpartynetwork
