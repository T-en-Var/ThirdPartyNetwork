name: Build and Deploy ASP.NET 9 Backend

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 9.0.x

      - name: Install EF Core CLI globally
        run: dotnet tool install --global dotnet-ef
        
      - name: Add dotnet tools to PATH
        run: echo "PATH=$HOME/.dotnet/tools:$PATH" >> $GITHUB_ENV

      - name: Publish backend
        run: dotnet publish -c Release -o publish

      - name: Copy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: "publish/*"
          target: "/var/www/thirdpartynetwork"

      - name: Generate SQL migrations (Local Tool)
        run: |
          # 1. Create a local tool manifest
          dotnet new tool-manifest
          
          # 2. Install the EF tool locally. 
          # The flag --version is omitted to let it pick the best match for the SDK, 
          # but since you are on .NET 9, we allow prereleases if needed.
          dotnet tool install dotnet-ef
          
          # 3. Run the migrations script using the LOCAL tool
          dotnet tool run dotnet-ef migrations script --idempotent \
            --project thirdpartynetwork/thirdpartynetwork.csproj \
            --context DataContext \
            --output migration.sql
          
      - name: Copy migrations to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          source: migration.sql
          target: /var/www/thirdpartynetwork

      - name: Apply migrations on server
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # set connection string directly
            DB_CONNECTION_STRING="${{ secrets.DB_CONNECTION_STRING }}"
            psql "$DB_CONNECTION_STRING" -f /var/www/thirdpartynetwork/migration.sql
            
      - name: Restart backend service
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            sudo systemctl daemon-reload
            sudo systemctl restart thirdpartynetwork
