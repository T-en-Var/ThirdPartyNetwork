services:
  tpn:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DB_CONNECTION_STRING: ${DB_CONNECTION_STRING}
      TOKEN_SECRET: ${TOKEN_SECRET}
      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}
      LUCKY_PENNY_LICENSE: ${LUCKY_PENNY_LICENSE}
      FRONTEND_URL: ${FRONTEND_URL}
      # PLAN.md §5: MinIO is a peer container on this same internal network — TPN talks
      # to it over the internal endpoint below, never a host-published port.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_INTERNAL_ENDPOINT: minio:9000
      MINIO_INTERNAL_USE_SSL: "false"
      # External/public hostname — MUST match whatever nginx (outside this compose file,
      # per PLAN.md §5) fronts as cdn.<domain>, because presigned URLs are signed against
      # this Host header (FILE_SERVICE_SETUP.md's presign/Host-header gotcha).
      MINIO_EXTERNAL_ENDPOINT: ${MINIO_EXTERNAL_ENDPOINT}
      MINIO_EXTERNAL_USE_SSL: ${MINIO_EXTERNAL_USE_SSL:-true}
      MINIO_PUBLIC_BUCKET: public
      MINIO_PRIVATE_BUCKET: private
    depends_on:
      - minio
    networks:
      - tpn-internal

  minio:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - tpn-internal
    # Deliberately no host-published ports (§5: "no host ports published for MinIO —
    # admin console reachable only via a temporary port-forward if needed"). Uncomment
    # only for local debugging, never in a real deployment:
    # ports:
    #   - "9000:9000"
    #   - "9001:9001"

networks:
  tpn-internal:
    driver: bridge

volumes:
  minio-data:
