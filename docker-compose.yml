  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - tpn-internal
    ports:
      - "9000:9000"
      - "9001:9001"

networks:
  tpn-internal:
    driver: bridge

volumes:
  minio-data:
